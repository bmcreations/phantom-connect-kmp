name: Publish SDKs

on:
  push:
    tags:
      - 'v*'

env:
  JAVA_VERSION: '21'

jobs:
  publish-maven:
    name: Publish to Maven Central
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: ${{ env.JAVA_VERSION }}

      - uses: gradle/actions/setup-gradle@v4

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Publish to Maven Central
        run: ./gradlew :phantom-connect:publishAndReleaseToMavenCentral -PVERSION_NAME=${{ steps.version.outputs.version }}
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_IN_MEMORY_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.SIGNING_IN_MEMORY_KEY_ID }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_IN_MEMORY_KEY_PASSWORD }}

  publish-ios:
    name: Publish iOS XCFramework
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: ${{ env.JAVA_VERSION }}

      - uses: gradle/actions/setup-gradle@v4

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build release XCFramework
        run: ./gradlew :phantom-connect:assemblePhantomConnectKMPReleaseXCFramework

      - name: Package XCFramework
        id: package
        run: |
          cd phantom-connect/build/XCFrameworks/release
          zip -r PhantomConnectKMP.xcframework.zip PhantomConnectKMP.xcframework
          echo "checksum=$(shasum -a 256 PhantomConnectKMP.xcframework.zip | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - name: Checkout public iOS repo
        uses: actions/checkout@v4
        with:
          repository: bmcreations/phantom-connect-ios
          token: ${{ secrets.IOS_REPO_PAT }}
          path: phantom-connect-ios

      - name: Update public repo
        env:
          VERSION: ${{ steps.version.outputs.version }}
          CHECKSUM: ${{ steps.package.outputs.checksum }}
        run: |
          # Copy Swift wrapper sources
          rm -rf phantom-connect-ios/Sources
          mkdir -p phantom-connect-ios/Sources
          cp Internal/PhantomConnectSDK/Sources/*.swift phantom-connect-ios/Sources/

          # Generate Package.swift
          cat > phantom-connect-ios/Package.swift << SWIFT
          // swift-tools-version: 5.9
          import PackageDescription

          let version = "${VERSION}"
          let checksum = "${CHECKSUM}"

          let package = Package(
              name: "PhantomConnectSDK",
              platforms: [.iOS(.v16)],
              products: [
                  .library(name: "PhantomConnectSDK", targets: ["PhantomConnectSDK", "PhantomConnectKMP"])
              ],
              targets: [
                  .target(name: "PhantomConnectSDK", dependencies: ["PhantomConnectKMP"], path: "Sources"),
                  .binaryTarget(
                      name: "PhantomConnectKMP",
                      url: "https://github.com/bmcreations/phantom-connect-ios/releases/download/\(version)/PhantomConnectKMP.xcframework.zip",
                      checksum: checksum
                  )
              ]
          )
          SWIFT

          # Remove leading whitespace from heredoc
          sed -i '' 's/^          //' phantom-connect-ios/Package.swift

      - name: Commit and push to public repo
        working-directory: phantom-connect-ios
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "Release ${VERSION}"
          git tag "${VERSION}"
          git push origin main --tags

      - name: Create GitHub Release with XCFramework
        env:
          GH_TOKEN: ${{ secrets.IOS_REPO_PAT }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "${VERSION}" \
            phantom-connect/build/XCFrameworks/release/PhantomConnectKMP.xcframework.zip \
            --repo bmcreations/phantom-connect-ios \
            --title "PhantomConnectKMP ${VERSION}" \
            --notes "XCFramework for Phantom Connect SDK ${VERSION}"
