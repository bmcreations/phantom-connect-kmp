name: E2E Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  JAVA_VERSION: '21'

jobs:
  e2e:
    name: Maestro E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      wiremock:
        image: wiremock/wiremock:3.3.1
        ports:
          - 8080:8080
        volumes:
          - ${{ github.workspace }}/maestro/mock-server/wiremock:/home/wiremock
        options: --name phantom-mock

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: ${{ env.JAVA_VERSION }}

      - uses: gradle/actions/setup-gradle@v4

      - name: Install Maestro
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Enable KVM (for Android emulator)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build mock flavor
        run: ./gradlew :sample-android:assembleMockDebug

      - name: Run E2E tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          force-avd-creation: true
          emulator-options: -no-snapshot -no-audio -no-boot-anim -no-window -gpu swiftshader_indirect
          disable-animations: true
          script: |
            adb install sample-android/build/outputs/apk/mock/debug/sample-android-mock-debug.apk
            maestro test maestro/full-flow.yaml

      - name: Upload test artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-debug
          path: ~/.maestro/tests/
          retention-days: 7
